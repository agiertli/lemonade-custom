---
# Replica configuration
replicas:
  llama: 1
  hap: 1
  promptInjection: 1

# Detector configuration
# Configure GPU usage and resources for each detector
detectors:
  # IBM HAP Detector (Granite Guardian)
  hap:
    useGpu: true
    resources:
      requests:
        cpu: '1'
        memory: 4Gi
      limits:
        cpu: '2'
        memory: 8Gi

  # Prompt Injection Detector (DeBERTa v3)
  promptInjection:
    useGpu: true
    resources:
      requests:
        cpu: '2'
        memory: 8Gi
      limits:
        cpu: '4'
        memory: 12Gi

# Translation service (TranslateGemma)
translateService:
  enabled: false
  hfToken: ""

# Language configuration
# To switch language: override these values (e.g. helm upgrade -f values-cs.yaml)
language:
  code: "sk"
  name: "slovensky"
  alsoAcceptLanguages: "cs"
  linguaImage: "quay.io/agiertli/lingua-language-detector:2.0.0"

  # User-facing messages (detector blocks, errors, etc.)
  messages:
    hap_input: "🤬 Vaša správa bola označená ako potenciálne škodlivý alebo nevhodný obsah."
    hap_output: "🤬 Odpoveď bola zablokovaná, pretože obsahovala potenciálne škodlivý alebo nevhodný obsah."
    prompt_injection_input: "👮 Vaša správa zrejme obsahuje inštrukcie, ktoré sa pokúšajú obísť systémové pravidlá."
    prompt_injection_output: "👮 Odpoveď bola zablokovaná, pretože obsahovala podozrivé inštrukcie."
    regex_competitor_input: "🍏 Môžem hovoriť iba o citrónoch! Iné ovocie a témy nie sú povolené."
    regex_competitor_output: "🍏 Ups! Takmer som hovoril o inom ovocí. Zostaneme pri citrónoch!"
    language_detection_input: "🇬🇧 I can only communicate in English. Please rephrase your message in English."
    language_detection_output: "🇬🇧 Oops! I almost answered in non-English. Let's stick to English!"
    followup: "Môžem vám pomôcť s niečím iným?"
    message_too_long: "Vaša správa je príliš dlhá! Prosím, položte krátku a jednoduchú otázku - ideálne do 100 znakov."
    language_rejection: "🇸🇰 Viem komunikovať iba po {language_name}. Preformulujte prosím svoju správu po {language_name}."
    no_response: "Žiadna odpoveď. Skúste to prosím znova."
    truncation: "\n\n---\n🍋🍋🍋 Dosiahnutá maximálna dĺžka odpovede 🍋🍋🍋\n\n_Aby citronáda tiekla pre všetkých, skrátili sme túto odpoveď na maximálnu dĺžku. Skúste položiť otázku, na ktorú sa dá odpovedať kratšie!_"

  # UI strings (header, example buttons, placeholder, footer)
  ui:
    header: "Vitajte v digitálnom stánku s citrónadou od Red Hat! 🍋"
    example1: "Prečo sú citróny kyslé?"
    example2: "Aký druh citróna mám použiť na citrónový koláč?"
    example3: "Povedz mi fakty o citrónoch, ty hlúpy asistent!"
    placeholder: "Napíšte správu..."
    footer: "Poháňané technológiou"
