---
# Replica configuration
replicas:
  llama: 1
  hap: 1
  promptInjection: 1

# Detector configuration
# Configure GPU usage and resources for each detector
detectors:
  # IBM HAP Detector (Granite Guardian)
  hap:
    useGpu: true
    resources:
      requests:
        cpu: '1'
        memory: 4Gi
      limits:
        cpu: '2'
        memory: 8Gi

  # Prompt Injection Detector (DeBERTa v3)
  promptInjection:
    useGpu: true
    resources:
      requests:
        cpu: '2'
        memory: 8Gi
      limits:
        cpu: '4'
        memory: 12Gi

# Translation service (TranslateGemma)
translateService:
  enabled: false
  hfToken: ""

# Language configuration
language:
  code: "sk"
  name: "slovensky"
  linguaImage: "quay.io/agiertli/lingua-language-detector-sk:1.0.0"

