---
# Production configuration for Slovak demo (itapa-sk-v2)
# GPU allocation: 2 LLaMA (L4) + 2 TranslateGemma (L40S) = 4 GPUs (3 spare L4)
# HAP and PI detectors run on CPU to free GPUs for throughput

replicas:
  llama: 2
  hap: 2
  promptInjection: 2

translateService:
  replicas: 2

detectors:
  hap:
    useGpu: false
    resources:
      requests:
        cpu: '4'
        memory: 4Gi
      limits:
        cpu: '8'
        memory: 8Gi

  promptInjection:
    useGpu: false
    resources:
      requests:
        cpu: '4'
        memory: 4Gi
      limits:
        cpu: '8'
        memory: 8Gi
