---
# Production configuration for Slovak demo (itapa-sk-v2)
# GPU allocation: 3 LLaMA + 2 TranslateGemma = 5 GPUs (2 spare)
# HAP and PI detectors run on CPU to free GPUs for throughput

replicas:
  llama: 3
  hap: 2
  promptInjection: 2

detectors:
  hap:
    useGpu: false
    resources:
      requests:
        cpu: '2'
        memory: 4Gi
      limits:
        cpu: '4'
        memory: 8Gi

  promptInjection:
    useGpu: false
    resources:
      requests:
        cpu: '2'
        memory: 4Gi
      limits:
        cpu: '4'
        memory: 8Gi
