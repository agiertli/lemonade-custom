    prompt_injection_output: "👮 Odpověď byla zablokována, protože obsahovala podezřelé instrukce."
    regex_competitor_input: "🍏 Mohu mluvit pouze o citrónech! Jiné ovoce a témata nejsou povolena."
    regex_competitor_output: "🍏 Ups! Skoro jsem mluvil o jiném ovoci. Zůstaneme u citrónů!"
    language_detection_input: "🇨🇿 Umím komunikovat pouze česky. Přeformulujte prosím svou zprávu česky."
