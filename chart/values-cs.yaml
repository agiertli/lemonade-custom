    no_response: "Žádná odpověď. Zkuste to prosím znovu."
    truncation: "\n\n---\n🍋🍋🍋 Dosažena maximální délka odpovědi 🍋🍋🍋\n\n_Aby citronáda tekla pro všechny, zkrátili jsme tuto odpověď na maximální délku. Zkuste položit otázku, na kterou se dá odpovědět kratčeji!_"

  ui:
    header: "Vítejte v digitálním stánku s citronádou od Red Hat! 🍋"
