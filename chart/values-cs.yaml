# Czech language configuration
# Usage: helm upgrade ... -f values.yaml -f values-cs.yaml
language:
  code: "cs"
  name: "česky"

  messages:
    hap_input: "🤬 Vaše zpráva byla označena jako potenciálně škodlivý nebo nevhodný obsah."
