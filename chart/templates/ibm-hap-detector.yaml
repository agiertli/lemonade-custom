---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: guardrails-detector-ibm-hap-predictor
  labels:
    app: guardrails-detector-ibm-hap-predictor
spec:
  replicas: {{ .Values.replicas.hap }}
  selector:
    matchLabels:
      app: guardrails-detector-ibm-hap-predictor
  template:
    metadata:
      labels:
        app: guardrails-detector-ibm-hap-predictor
    spec:
      containers:
        - resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          name: hap-detector
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: LOG_LEVEL
              value: INFO
          ports:
            - containerPort: 8000
              protocol: TCP
          imagePullPolicy: Always
          terminationMessagePolicy: File
          command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          image: 'quay.io/agiertli/hap-detector-sk:1.0.0'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
kind: Service
apiVersion: v1
metadata:
  name: guardrails-detector-ibm-hap-predictor
  labels:
    app: guardrails-detector-ibm-hap-predictor
spec:
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  internalTrafficPolicy: Cluster
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: guardrails-detector-ibm-hap-predictor
